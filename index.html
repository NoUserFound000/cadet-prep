<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#004225">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cadet Prep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* Theme: design language from Ricky's reference deck (deep green, gold, cream, serif headings). */
:root{--bg:#FBFAF5;--panel:#FFFFFF;--panel2:#F3F0E6;--text:#1F2A24;--muted:#5C605B;--accent:#004225;--on-accent:#FFFFFF;--gold:#8A6A33;--gold2:#A8874A;--again:#B5523B;--hard:#C9AE74;--good:#004225;--easy:#5B8C70;--line:#D9D2C0;--tint:#E7EFEA;--radius:4px;--shadow:0 2px 6px rgba(31,42,36,.12);--serif:Georgia,Cambria,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E1F17;--panel:#14291F;--panel2:#1B3328;--text:#F3F0E6;--muted:#B9B4A6;--accent:#D8C395;--on-accent:#0E1F17;--gold:#D8C395;--gold2:#C9AE74;--line:#2C4437;--tint:#1B3328;--good:#5B8C70;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Calibri,Carlito,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font:400 28px/1.2 var(--serif);color:var(--accent);margin:2px 0 16px}h2,.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:22px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.gold{border-color:var(--gold2)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.stat{font:400 34px/1.1 var(--serif);color:var(--accent)}.small{font-size:13px;color:var(--muted)}
button,.btn{appearance:none;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font:inherit;font-weight:600;background:var(--panel2);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);width:100%;letter-spacing:.04em}
button:disabled{opacity:.4}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades button{padding:12px 4px;font-size:14px}.grades small{display:block;font-weight:400;opacity:.8;font-size:11px}
.grades button{color:#fff;border:0}.g1{background:var(--again)}.g2{background:var(--hard);color:#1F2A24!important}.g3{background:var(--good)}.g4{background:var(--easy)}
.q{font:400 22px/1.3 var(--serif);color:var(--accent);margin:4px 0 12px}.a{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.a small{color:var(--gold)}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:10px;font:inherit}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:10px;font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;border-radius:0;padding:12px 4px;font-size:13px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--gold2)}
.deck{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.deck:last-child{border:0}
.pill{display:inline-block;min-width:28px;text-align:center;border-radius:99px;padding:2px 8px;font-size:13px;background:var(--panel2)}
.pill.due{background:var(--accent);color:var(--on-accent)}
.tag{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.bar{height:4px;background:var(--panel2);border-radius:2px;margin:6px 0 10px;overflow:hidden}.bar div{height:100%;width:0;background:var(--gold2);transition:width .25s linear}.bar div.over{background:var(--again)}
.pill.g1{background:var(--again)}.pill.g2{background:var(--hard)}.pill.g3{background:var(--good)}.pill.g4{background:var(--easy)}
.deck .pill{align-self:center;flex:none;white-space:nowrap}
.hide{display:none}
body.reading main{max-width:none;padding:0 8px 16px}
#pages{overflow-x:auto}
.rbar{position:sticky;top:0;z-index:2;display:flex;gap:6px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);margin:0 -8px 8px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top))}
.rbar button{padding:8px 12px}.rbar input{width:3.2em;padding:6px;text-align:center}
.rtitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 17px var(--serif);color:var(--accent)}
.pg{position:relative;margin:0 auto 8px;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line)}
.pg canvas{display:block;width:100%;height:100%}
.pg span{position:absolute;right:6px;bottom:4px;font-size:11px;color:#5C605B}
.doc button{padding:8px 12px}
input[type=search]{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:12px;font:inherit;margin-bottom:12px}
.hit{cursor:pointer}.hit mark{background:var(--hard);color:#1F2A24;border-radius:2px}
.rbar{flex-wrap:wrap}.rfind{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main id="view"></main>
<nav>
  <button data-go="home" class="on">Today</button>
  <button data-go="decks">Decks</button>
  <button data-go="library">Library</button>
  <button data-go="log">Log</button>
  <button data-go="answers">Answers</button>
  <button data-go="settings">Settings</button>
</nav>
<script src="library.js"></script>
<script src="app.js"></script>
</body>
</html>
